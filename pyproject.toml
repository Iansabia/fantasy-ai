[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-ai"
version = "0.1.0"
description = "AI fantasy football manager for ESPN leagues (plain-code decisions, LLM only explains)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["espn-api", "pyyaml", "httpx", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "cryptography", "nflreadpy", "polars"]
ci = ["anthropic", "cryptography", "nflreadpy", "polars"]   # API fallback, encrypted state, nflverse usage

[project.scripts]
fai = "fantasy_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
