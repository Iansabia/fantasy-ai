# Copy to config/leagues.yaml (gitignored) and fill in real ids.
# league_id: the leagueId=... number in any ESPN fantasy URL.
# team_id:   the teamId=... number on YOUR team page. Writes refuse any other team.
# auth_profile: picks cookies ESPN_S2_<PROFILE> and SWID_<PROFILE> from .env.
leagues:
  - name: demo            # offline fixture league, works with no cookies
    owner: ian
    league_id: 99
    team_id: 1
    year: 2026
    auth_profile: ian
    fixture: tests/fixtures/demo
  - name: main
    owner: ian
    league_id: 0          # TODO: fill in
    team_id: 0            # TODO: fill in
    year: 2026
    auth_profile: ian
  - name: family
    owner: cousin
    league_id: 0          # TODO: fill in
    team_id: 0            # TODO: fill in
    year: 2026
    auth_profile: cousin

settings:
  auto_lineup: false          # true = `fai autopilot --send` sets lineups with no confirmation
  waivers_need_approval: true # locked to true in code
  trades_propose_only: true   # locked to true in code; trades are never accepted automatically

notify:
  backend: console            # console | imessage | twilio
  to:                         # owner -> env var in .env holding comma-separated phone numbers
    ian: NOTIFY_TO_IAN
    cousin: NOTIFY_TO_COUSIN
