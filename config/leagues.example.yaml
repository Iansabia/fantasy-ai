# Copy to config/leagues.yaml (gitignored) and fill in real ids.
# league_id: the leagueId=... number in any ESPN fantasy URL.
# team_id:   the teamId=... number on YOUR team page. Writes refuse any other team.
# auth_profile: picks cookies ESPN_S2_<PROFILE> and SWID_<PROFILE> from .env.
leagues:
  - name: demo            # offline fixture league, works with no cookies
    owner: ian
    league_id: 99
    team_id: 1
    year: 2026
    auth_profile: ian
    fixture: tests/fixtures/demo
  - name: main
    owner: ian
    league_id: 0          # TODO: fill in
    team_id: 0            # TODO: fill in
    year: 2026
    auth_profile: ian
  - name: family
    owner: cousin
    league_id: 0          # TODO: fill in
    team_id: 0            # TODO: fill in
    year: 2026
    auth_profile: cousin

settings:
  auto_lineup: false          # true = `fai autopilot --send` sets lineups with no confirmation
  waivers_need_approval: true # locked to true in code
  trades_propose_only: true   # locked to true in code; trades are never accepted automatically

notify:
  backend: console            # console | imessage | twilio
  to:                         # owner -> env var in .env holding comma-separated phone numbers
    ian: NOTIFY_TO_IAN
    cousin: NOTIFY_TO_COUSIN

# Factor weights and caps (all optional; defaults in src/fantasy_ai/factors/score.py).
factors:
  matchup: {weight: 0.0, cap: 0.12}      # OFF: hurt weekly accuracy in the 2026 wk 2-3 replay (see score.py)
  vegas: {weight: 0.4, cap: 0.10}        # needs ODDS_API_KEY in .env, skipped otherwise
  usage: {weight: 0.15, cap: 0.08}       # needs the optional nflreadpy package
  ceiling: {weight: 0.15, cap: 0.04}
  total_cap: [0.70, 1.35]                # clamp on the product of all factors

# Anti-ban pacing (defaults in src/fantasy_ai/pacing.py).
pacing:
  writes_per_league_per_day: 6
  writes_per_run: 3
  cooldown_hours: 24

# Waiver scoring (defaults in src/fantasy_ai/waivers.py).
waivers:
  horizon: 3                 # weeks of lineup impact
  next3_weight: 1.0
  ros_weight: 1.0
  handcuff_bump: 0.15        # RB whose starter is OUT/IR
  min_gain_free_agent: 3.0   # points over the horizon
  min_gain_waiver: 8.0       # rolling priority: a claim must clear a higher bar
  rolling_priority: true
  stream_margin: 1.5         # K / D/ST streamer must beat our starter by this much

# Run schedule (Eastern): Thursday 2pm full run, Saturday 2pm recheck. The Sunday 11:45am
# inactive check (after 1:00pm inactives at 11:30) is off unless enabled here (and its launchd
# template / cron is turned on). The same run list decides whether a questionable starter can
# wait for a later run ("decision deferred") or must be decided now (final pre-game run).
schedule:
  sunday_inactive_check: false
  # runs: {full: "thu 14:00", recheck: "sat 14:00", inactives: "sun 11:45"}   # optional override
