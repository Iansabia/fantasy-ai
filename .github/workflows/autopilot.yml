# fantasy-ai autopilot. Public-repo safe:
# - league config and cookies come only from secrets; nothing personal is committed
# - every command runs with --quiet: logs show counts only ("league 1: 2 moves, sent")
# - state (pending approvals, news cache) is Fernet-encrypted (STATE_KEY) before actions/cache
# - DRY RUN unless the repo variable LIVE is "true"
#
# Secrets: LEAGUES_YAML, ESPN_S2_COUSIN, SWID_COUSIN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#          ANTHROPIC_API_KEY, STATE_KEY   (add ESPN_S2_IAN / SWID_IAN for Ian's own leagues)
# Variable: LIVE=true to really set lineups / send approved moves.
#
# Cron is UTC. ET = UTC-4 (EDT) until 2026-11-01, then UTC-5 (EST). The Thursday/Saturday runs
# at 18:00 UTC land at 2:00pm EDT, then 1:00pm EST after Nov 1 (still well before games).
# GitHub cron can start 5-30 min late; the catchup job covers a missed Thursday run.
name: autopilot

on:
  schedule:
    - cron: "0 18 * 9-12,1 4"      # Thursday 2pm EDT: full run (news, factors, Vegas, IR, waiver ideas)
    - cron: "0 18 * 9-12,1 6"      # Saturday 2pm EDT: recheck (lineups + IR only)
    - cron: "45 15 * 9-12,1 0"     # Sunday 11:45am EDT: inactive check, only if schedule.sunday_inactive_check
    - cron: "30 */3 * 9-12,1 5,6,0"  # Fri-Sun every 3h: catch-up if Thursday's run was missed
    - cron: "0 14 * 9-12,1 2,3"    # Tue/Wed 10am EDT: waiver suggestions (approval queue)
    - cron: "*/30 * * 9-12,1 *"    # every 30 min in season: read Telegram approvals
  workflow_dispatch:
    inputs:
      mode:
        description: "full | recheck | inactives | catchup | waivers | poll"
        default: full

concurrency:
  group: fantasy-ai          # never two runs at once (no double sends, no state races)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      FAI_QUIET: "1"
      FAI_NOTIFY_BACKEND: telegram
      LEAGUES_YAML: ${{ secrets.LEAGUES_YAML }}
      ESPN_S2_COUSIN: ${{ secrets.ESPN_S2_COUSIN }}
      SWID_COUSIN: ${{ secrets.SWID_COUSIN }}
      ESPN_S2_IAN: ${{ secrets.ESPN_S2_IAN }}
      SWID_IAN: ${{ secrets.SWID_IAN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FAI_LLM_MAX_CALLS: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e '.[ci]'

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 * * 9-12,1 *") echo "mode=poll" >> "$GITHUB_OUTPUT" ;;
            "0 14 * 9-12,1 2,3") echo "mode=waivers" >> "$GITHUB_OUTPUT" ;;
            "0 18 * 9-12,1 4") echo "mode=full" >> "$GITHUB_OUTPUT" ;;
            "0 18 * 9-12,1 6") echo "mode=recheck" >> "$GITHUB_OUTPUT" ;;
            "45 15 * 9-12,1 0") echo "mode=inactives" >> "$GITHUB_OUTPUT" ;;
            "30 */3 * 9-12,1 5,6,0") echo "mode=catchup" >> "$GITHUB_OUTPUT" ;;
            "") echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=full" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: .state/state.enc
          key: fai-state-${{ github.run_id }}
          restore-keys: fai-state-
      - run: fai state unpack

      - name: Lineups (automatic; heartbeat text every run)
        if: contains(fromJSON('["full","recheck","inactives","catchup"]'), steps.mode.outputs.mode)
        run: fai autopilot --mode ${{ steps.mode.outputs.mode }} --jitter --notify ${{ vars.LIVE == 'true' && '--send' || '' }}
      - name: Waiver suggestions (approval queue only)
        if: steps.mode.outputs.mode == 'waivers'
        run: fai autopilot --mode recheck --waivers --jitter --notify
      - name: Telegram approvals
        if: steps.mode.outputs.mode == 'poll'
        run: |
          if [ "${{ vars.LIVE }}" = "true" ]; then fai poll-telegram; else echo "poll skipped: dry run (LIVE is not true)"; fi

      - name: Save encrypted state
        if: always()
        run: fai state pack
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state/state.enc
          key: fai-state-${{ github.run_id }}
